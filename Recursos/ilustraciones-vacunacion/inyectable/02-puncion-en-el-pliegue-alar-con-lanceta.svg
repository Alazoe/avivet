<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" role="img" aria-label="Punción en el pliegue alar con lanceta">
        <!-- ala extendida -->
        <g fill="none" stroke="#1b5e20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M36 150 Q74 84 166 76 Q258 70 318 108"/>
          <path d="M36 150 Q92 168 172 162 Q258 156 318 108"/>
          <path d="M100 122 Q148 112 198 110 M112 142 Q160 136 214 130"/>
        </g>
        <!-- zona sin plumas del pliegue -->
        <ellipse cx="98" cy="122" rx="34" ry="21" fill="#2e7d32" opacity=".14" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 4"/>
        <path d="M98 101 L98 62" fill="none" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="4 3"/>
        <text x="98" y="52" font-size="11" font-weight="800" fill="#2e7d32" text-anchor="middle">área sin plumas</text>
        <text x="98" y="38" font-size="10" fill="#555" text-anchor="middle">(pliegue del ala)</text>
        <!-- lanceta: mango + dos agujas -->
        <g fill="none" stroke="#1565c0" stroke-width="4" stroke-linecap="round">
          <path d="M254 206 L166 140"/>
        </g>
        <g fill="none" stroke="#1565c0" stroke-width="2.4" stroke-linecap="round">
          <path d="M166 140 L128 116"/>
          <path d="M172 132 L134 108"/>
        </g>
        <path d="M240 216 L268 196" fill="none" stroke="#1565c0" stroke-width="1.6" stroke-dasharray="4 3"/>
        <text x="272" y="196" font-size="11" font-weight="800" fill="#1565c0">lanceta</text>
        <text x="272" y="209" font-size="10" fill="#555">2 agujas</text>
        <!-- flecha: traspasar -->
        <path d="M112 96 L146 74" fill="none" stroke="#c62828" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M146 74 l-11 0 l3 10" fill="none" stroke="#c62828" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="152" y="72" font-size="11" font-weight="800" fill="#c62828">traspasar el pliegue</text>
      </svg>
