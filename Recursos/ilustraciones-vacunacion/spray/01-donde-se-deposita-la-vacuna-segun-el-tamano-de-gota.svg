<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" width="460" height="210" viewBox="0 0 460 210" role="img" aria-label="Dónde se deposita la vacuna según el tamaño de gota">
        <!-- cabeza y tracto -->
        <g fill="none" stroke="#1b5e20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M96 66 q4 -16 12 -6 q4 -17 13 -6 q6 -15 13 -3"/>
          <circle cx="120" cy="84" r="26"/>
          <path d="M146 76 l30 6 l-28 8"/>
          <path d="M120 110 q-4 22 4 38 l0 16"/>
          <circle cx="128" cy="80" r="3.6" fill="#1b5e20" stroke="none"/>
        </g>
        <!-- pulmones y sacos aéreos -->
        <g fill="none" stroke="#1b5e20" stroke-width="2.2" stroke-linejoin="round">
          <path d="M124 164 q-26 2 -30 22 q-2 18 16 18 q16 0 16 -20 z"/>
          <path d="M124 164 q26 2 30 22 q2 18 -16 18 q-16 0 -16 -20 z"/>
          <path d="M104 178 q10 4 12 14 M144 178 q-10 4 -12 14" stroke-width="1.5" opacity=".6"/>
        </g>
        <!-- gota gruesa -->
        <g>
          <circle cx="256" cy="60" r="13" fill="#2e7d32" opacity=".8"/>
          <circle cx="286" cy="52" r="10" fill="#2e7d32" opacity=".65"/>
          <circle cx="282" cy="76" r="8" fill="#2e7d32" opacity=".5"/>
          <path d="M240 62 L150 78" stroke="#2e7d32" stroke-width="2.4" stroke-dasharray="6 4"/>
          <path d="M158 74 l-10 4 l9 5" fill="none" stroke="#2e7d32" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="306" y="50" font-size="15" font-weight="800" fill="#2e7d32">&gt; 100 µm</text>
          <text x="306" y="68" font-size="12" fill="#1b5e20">Gota gruesa</text>
          <text x="306" y="85" font-size="11" fill="#555">Ojos, narinas y plumas</text>
          <text x="306" y="100" font-size="11" fill="#555">Tracto respiratorio alto</text>
          <text x="306" y="115" font-size="11" font-weight="700" fill="#2e7d32">Más segura y uniforme</text>
        </g>
        <!-- gota fina -->
        <g>
          <circle cx="252" cy="160" r="4" fill="#c62828" opacity=".85"/>
          <circle cx="268" cy="152" r="3" fill="#c62828" opacity=".7"/>
          <circle cx="266" cy="170" r="3.4" fill="#c62828" opacity=".7"/>
          <circle cx="282" cy="162" r="2.6" fill="#c62828" opacity=".6"/>
          <path d="M240 162 L152 190" stroke="#c62828" stroke-width="2.4" stroke-dasharray="6 4"/>
          <path d="M160 186 l-10 5 l10 4" fill="none" stroke="#c62828" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="306" y="150" font-size="15" font-weight="800" fill="#c62828">&lt; 70 µm</text>
          <text x="306" y="168" font-size="12" fill="#7a1c1c">Gota fina</text>
          <text x="306" y="185" font-size="11" fill="#555">Pulmones y sacos aéreos</text>
          <text x="306" y="200" font-size="11" font-weight="700" fill="#c62828">Reacción post-vacunal</text>
