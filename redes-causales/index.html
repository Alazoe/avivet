<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Redes causales · AviVet</title>
<meta name="description" content="Redes causales y árboles de investigación de brotes en ponedoras, construidos desde la wiki AviVet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1b4332">
<style>
/* Una sola app para todos los problemas: portada (problemas, mapa entre ellos, factores compartidos)
   → por problema dos vistas: red causal (SVG + panel + medidas) e investigación de brote (pasos + ranking). */
:root{
  --bg:#f5f4f0; --surface:#fff; --surface2:#f0ede8; --border:#ddd9d0;
  --text:#1a1916; --text2:#5a5650; --text3:#8a847c;
  --accent:#1b4332; --accent2:#2d6a4f; --accent-l:#d8f3dc; --gold:#b5813a; --gold-l:#fdf3e0;
  --origen:#3d6b8c; --mecanismo:#8a6a2f; --evento:#b4532f; --consec:#8f2d3a; --prev:#2d6a4f; --prev-l:#e3f1e9;
  --hot:#b4532f; --hot-l:#f6e6de; --info-l:#e3edf4;
  --serif:'Fraunces',Georgia,serif; --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1a211e; --surface2:#222b27; --border:#2f3a35;
  --text:#e6ebe8; --text2:#a6b3ad; --text3:#7d8a84;
  --accent:#173a2b; --accent2:#7fd1a4; --accent-l:#1f3a2c; --gold:#e0b46a; --gold-l:#3a2f1c;
  --origen:#7fb0d4; --mecanismo:#d4b06c; --evento:#ec8a62; --consec:#e7798a; --prev:#6fcf98; --prev-l:#1c3328;
  --hot:#ec8a62; --hot-l:#3a2219; --info-l:#1b2a35; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a211e; --surface2:#222b27; --border:#2f3a35;
  --text:#e6ebe8; --text2:#a6b3ad; --text3:#7d8a84;
  --accent:#173a2b; --accent2:#7fd1a4; --accent-l:#1f3a2c; --gold:#e0b46a; --gold-l:#3a2f1c;
  --origen:#7fb0d4; --mecanismo:#d4b06c; --evento:#ec8a62; --consec:#e7798a; --prev:#6fcf98; --prev-l:#1c3328;
  --hot:#ec8a62; --hot-l:#3a2219; --info-l:#1b2a35; color-scheme:dark }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent2)}
.cont{max-width:1220px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--serif);line-height:1.15;text-wrap:balance}
h1{font-size:clamp(24px,4vw,34px);color:var(--text)}
h2{font-size:21px}
h3{font-size:16px;font-family:'DM Sans',system-ui,sans-serif;font-weight:700}
ul,ol{padding-left:20px;display:grid;gap:4px}
.nota{font-size:13px;color:var(--text2);max-width:85ch}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
.lead{color:var(--text2);max-width:72ch;margin-top:6px}
.oculto,[hidden]{display:none!important}

/* Cabecera */
.cab{background:var(--accent);color:#fff;border-bottom:3px solid var(--gold)}
.cab .cont{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.marca{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.1;color:#fff;text-decoration:none}
.marca small{display:block;font-family:'DM Sans';font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#e8c98a}
.miga{font-size:14px;color:rgba(255,255,255,.8)}
.miga a{color:#fff}
.tabs{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.tabs .cont{display:flex;gap:2px;overflow-x:auto}
.tab{border:none;background:none;border-bottom:3px solid transparent;padding:12px 14px;font-weight:600;font-size:14px;color:var(--text2);text-decoration:none;white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent2);border-bottom-color:var(--accent2)}
main{padding:24px 0 64px}
main>.cont{display:grid;gap:24px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:grid;gap:12px;align-content:start;min-width:0;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--accent2)}
.btn.prim{background:var(--accent2);border-color:var(--accent2);color:#fff}
:root[data-theme="dark"] .btn.prim{color:#10201a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.prim{color:#10201a}}
button:focus-visible,a:focus-visible,input:focus-visible,.node:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

/* Portada */
.problemas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.prob h2{font-size:19px}
.prob .acciones{display:flex;gap:8px;flex-wrap:wrap}
.prob.prep{background:var(--surface2);box-shadow:none}
.estado{justify-self:start;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accent-l);color:var(--accent2)}
.prob.prep .estado{background:var(--gold-l);color:var(--gold)}
.mapa svg{display:block;width:100%;max-width:760px;height:auto;margin:0 auto}
.mapa .pn circle{fill:var(--surface);stroke-width:2.5}
.mapa .pn text{fill:var(--text);font-size:13px;font-weight:600;text-anchor:middle}
.mapa .pn.prep circle{stroke-dasharray:5 4}
.mapa .rel{fill:none;stroke:var(--text3);stroke-width:1.5}
.mapa a{cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text2)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--border);color:var(--text2);margin:2px 4px 2px 0;text-decoration:none}
a.chip:hover{border-color:var(--accent2);color:var(--text)}
.tabla{overflow-x:auto}

/* Red causal */
.leyenda{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--text2)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.net{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:1400px){.net{grid-template-columns:minmax(0,1fr)}.panel{position:static!important}}
.svgbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto}
.svgbox svg{display:block;min-width:900px;width:100%;height:auto}
.node rect{fill:var(--surface);stroke-width:1.6;cursor:pointer}
.node text{fill:var(--text);font-size:12.5px;pointer-events:none}
.node .tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em}
.node .central{font-weight:700}
.node:focus{outline:none}
.node:focus-visible rect,.node.sel rect{stroke-width:3}
.node.cut rect{stroke:var(--prev)!important;stroke-width:3;stroke-dasharray:6 3;fill:var(--prev-l)}
.node .link{font-size:10.5px;fill:var(--text3)}
.edge{fill:none;stroke:var(--text3);stroke-width:1.4;opacity:.6}
.edge.ciclo{stroke:var(--consec);stroke-dasharray:5 4;opacity:.85}
.edge.protege{stroke:var(--prev);stroke-dasharray:3 4;opacity:.9}
.edge.discutida{stroke-dasharray:2 4;opacity:.75}
.edge.hot{opacity:1;stroke-width:2.4}
.grphead{fill:var(--text3);font-family:var(--mono);font-size:10px;letter-spacing:.08em}
.ev{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:99px;border:1px solid currentColor;margin-left:6px;letter-spacing:0;text-transform:none}
.dim{opacity:.16}
.colhead{fill:var(--text2);font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.panel{position:sticky;top:60px}
.panel p{margin:0}
.panel .kind{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ventana .bar{position:relative;height:28px;border-radius:6px;background:var(--surface2)}
.ventana .risk{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--evento);opacity:.55}
.ventana .risk.fuerte{opacity:.9}
.ticks{position:relative;height:18px;font-family:var(--mono);font-size:11px;color:var(--text2)}
.ticks span{position:absolute;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.medidas{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.medida{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:grid;gap:8px;align-content:start;cursor:pointer;text-align:left;color:inherit}
.medida.on{border-color:var(--prev);box-shadow:0 0 0 2px var(--prev) inset}
.medida h3{display:flex;gap:8px;align-items:baseline}
.medida h3 b{font-family:var(--mono);font-size:12px;color:var(--prev);font-weight:500}
.medida ul{font-size:14px;gap:3px}
.medida .meta{font-size:12px;color:var(--text2)}
.fuentes ol{font-size:14px;margin-top:8px}
.fuentes li:target{background:var(--gold-l)}
@media (prefers-reduced-motion:no-preference){.node rect,.edge{transition:opacity .2s,stroke-width .2s}}

/* Brote */
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.brote{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-items:start}
@media (max-width:900px){.row2,.brote{grid-template-columns:minmax(0,1fr)}}
h2 .n{font-family:var(--mono);font-size:12px;color:var(--accent2);font-weight:500;letter-spacing:.06em;margin-right:8px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 8px;border-radius:6px}
.check:hover,.check.on{background:var(--info-l)}
.check input{margin-top:4px;accent-color:var(--accent2);flex:none;width:16px;height:16px}
.grupo{display:grid;gap:2px}
.grupo>.eyebrow{margin:8px 0 2px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent2);border-color:var(--accent2);color:var(--surface)}
.semanas{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.semanas input{width:84px;padding:7px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-variant-numeric:tabular-nums}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--hot-l);border-radius:8px;padding:10px 12px;font-size:14px}
.hyp{border:1px solid var(--border);border-radius:10px;padding:14px;display:grid;gap:8px;background:var(--surface)}
.hyp.top{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot) inset}
.hyp header{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.score{font-family:var(--mono);font-size:12px;color:var(--text2);white-space:nowrap}
.barra{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.barra i{display:block;height:100%;background:var(--hot)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--hot-l)}
.pchip.prior{background:var(--info-l)}
details summary{cursor:pointer;font-weight:600;font-size:14px}
details[open] summary{margin-bottom:6px}
.hyp .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;font-size:14px}
@media (max-width:520px){.hyp .cols{grid-template-columns:minmax(0,1fr)}}
.src{font-size:12px;color:var(--text2)}
.copyrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast{font-size:13px;color:var(--accent2)}
textarea.copy{width:100%;min-height:130px;font:13px var(--mono);border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--bg)}
.error{background:var(--hot-l);border-radius:8px;padding:14px}
</style>
</head>
<body>
<header class="cab"><div class="cont">
  <a class="marca" href="#/">Redes causales<small>AviVet · ponedoras</small></a>
  <nav class="miga" id="miga" aria-label="Ubicación"></nav>
</div></header>
<nav class="tabs oculto" id="tabs" aria-label="Vistas del problema"><div class="cont" id="tabsc"></div></nav>
<main><div class="cont" id="app" aria-live="polite"></div></main>
<script src="app.js?v=3"></script>
</body>
</html>
